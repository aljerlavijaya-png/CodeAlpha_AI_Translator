<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Translation History</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>📜 Translation History</h1>

    <input
        type="text"
        id="search"
        placeholder="🔍 Search Translation..."
        onkeyup="searchTable()">

    <br><br>

    {% if rows %}

    <table>

        <tr>

            <th>ID</th>

            <th>Source</th>

            <th>Target</th>

            <th>Original Text</th>

            <th>Translated Text</th>

            <th>Date</th>

        </tr>

        {% for row in rows %}

        <tr>

            <td>{{ row[0] }}</td>

            <td>{{ row[1] }}</td>

            <td>{{ row[2] }}</td>

            <td>{{ row[3] }}</td>

            <td>{{ row[4] }}</td>

            <td>{{ row[5] }}</td>

        </tr>

        {% endfor %}

    </table>

    {% else %}

    <h2>No Translation History Available</h2>

    {% endif %}

    <br><br>

    <a href="/">

        <button>

            🏠 Back to Translator

        </button>

    </a>

    <a href="/dashboard">

        <button>

            📊 Dashboard

        </button>

    </a>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
